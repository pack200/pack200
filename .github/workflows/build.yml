name: Build

on: [push, pull_request]

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17, 21, 25]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Tests
        run: mvn -B test

      - name: Coverage report
        if: matrix.java == 8
        run: mvn -B -Pcoverage test jacoco:report coveralls:report -DrepoToken=${{ secrets.COVERALLS_REPO_TOKEN }} || true

  experimental:
    name: Java EA
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java EA
        uses: oracle-actions/setup-java@v1
        with:
          website: jdk.java.net
          release: EA
          cache: maven

      - name: Tests
        run: |
          mvn -version
          mvn -B test || true

  native:
    name: Native ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     platform: linux-x86-64,   lib: target/native/build/libpack200.so }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64,  lib: target/native/build/libpack200.so }
          - { os: macos-15,         platform: darwin-aarch64, lib: target/native/build/libpack200.dylib }
          - { os: windows-2022,     platform: win32-x86-64,   lib: target/native/build/pack200.dll }
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set up zlib
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zlib1g-dev

      - name: Build and test the native unpacker
        run: mvn -B -Pnative test

      - name: Archive the native library
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: ${{ matrix.lib }}

      - name: Archive the unpack200 executable
        uses: actions/upload-artifact@v7
        with:
          name: unpack200-${{ matrix.platform }}
          path: |
            target/native/build/unpack200
            target/native/build/unpack200.exe

  package:
    name: Package
    runs-on: ubuntu-24.04
    needs: [test, native]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
          cache: maven

      - name: Download the native libraries
        uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: src/main/resources/io/pack200/native

      - name: Strip the artifact prefix from the platform directories
        run: cd src/main/resources/io/pack200/native && for d in native-*; do mv "$d" "${d#native-}"; done && ls -R

      - name: Packaging
        run: mvn -B package -DskipTests

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pack200-artifacts
          path: |
            target/pack200-*.jar
            target/*.deb
            target/*.rpm
